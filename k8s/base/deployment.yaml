apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-execution
  labels:
    app: oficina-execution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-execution
  template:
    metadata:
      labels:
        app: oficina-execution
    spec:
      serviceAccountName: oficina-execution
      containers:
        - name: cloud-sql-proxy
          # Mesmo padrão do OS Service: a instância Cloud SQL não aceita rede
          # externa, só o proxy autenticado por Workload Identity. O banco
          # (execucao_<ambiente>) e o usuário são exclusivos deste serviço.
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4
          args:
            - "--structured-logs"
            - "--port=5432"
            - "oficina-501820:southamerica-east1:oficina-postgres"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
        - name: oficina-execution
          image: ghcr.io/robsonago/oficina-execution-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-execution-config
            - secretRef:
                name: oficina-execution-secret
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "640Mi"
