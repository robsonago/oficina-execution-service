apiVersion: v1
kind: Service
metadata:
  name: oficina-execution
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  selector:
    app: oficina-execution
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
