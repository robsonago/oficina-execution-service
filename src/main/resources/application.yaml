spring:
  application:
    name: oficina-execution-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/execucao}
    username: ${DB_USERNAME:execucao}
    password: ${DB_PASSWORD:execucao123}
    hikari:
      maximum-pool-size: ${DB_POOL_MAXIMO:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFN5c3RlbU9maWNpbmFNZWNhbmljYTIwMjQ=}

mensageria:
  provider: ${MENSAGERIA_PROVIDER:memoria}
  project-id: ${PUBSUB_PROJECT_ID:oficina-local}
  emulador-host: ${PUBSUB_EMULATOR_HOST:}
  assinatura: ${PUBSUB_ASSINATURA_COMANDOS:oficina-execucao-comandos-local-execucao}
  topicos:
    os-eventos: ${PUBSUB_TOPICO_OS_EVENTOS:oficina-os-eventos-local}
  outbox:
    intervalo-ms: ${OUTBOX_INTERVALO_MS:1000}

springdoc:
  api-docs:
    path: /execucao/api-docs
  swagger-ui:
    path: /execucao/swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: oficina-execution-service

logging:
  level:
    br.com.fiap: INFO
    org.springframework.security: WARN
